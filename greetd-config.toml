# losker — greetd config
# install path: /etc/greetd/config.toml

[terminal]
# same VT ly used; Ctrl+Alt+F2..F6 stay available as TTY escape hatches
vt = 1

[default_session]
# niri as the greeter compositor, hosting losker (CRT login UI + built-in
# touch OSK). see /etc/greetd/niri-greeter.kdl for the fullscreen rule and
# the losker watchdog spawn line
command = "niri -c /etc/greetd/niri-greeter.kdl"
user = "greeter"
