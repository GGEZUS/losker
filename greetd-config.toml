# losker · phase 1 — greetd config
# install path: /etc/greetd/config.toml

[terminal]
# same VT ly used; Ctrl+Alt+F2..F6 stay available as TTY escape hatches
vt = 1

[default_session]
# niri (the tablet fork, same as the user session) hosting:
#   gtkgreet — login UI (question-driven: username → PAM asks → password)
#   wvkbd-mobintl — touch OSK, layer-shell docked at the bottom
# see /etc/greetd/niri-greeter.kdl
command = "niri -c /etc/greetd/niri-greeter.kdl"
user = "greeter"
